<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiScribe - Prompt Oluşturucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ekstra küçük stiller buraya eklenebilir */
        #loading-spinner {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="container mx-auto p-6 max-w-3xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">AiScribe Prompt Oluşturucu</h1>

        <form id="prompt-form" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="mb-4">
                <label for="prompt-input" class="block text-gray-700 text-sm font-semibold mb-2">Prompt'unuzu Girin:</label>
                <textarea id="prompt-input" name="prompt" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150" placeholder="Örn: Ormanda yürüyen Kırmızı Başlıklı Kız"></textarea>
            </div>

            <div class="mb-4 flex items-center">
                <input type="checkbox" id="auto-expand-checkbox" name="auto_expand" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="auto-expand-checkbox" class="ml-2 block text-sm text-gray-900">Prompt'u Otomatik Genişlet (Daha zengin alternatifler üretir)</label>
            </div>

            <div class="text-center">
                <button type="submit" id="submit-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-150 ease-in-out inline-flex items-center">
                    İşle
                    <span id="loading-spinner" class="hidden ml-2 w-4 h-4 border-2 border-white border-solid rounded-full"></span>
                </button>
            </div>
        </form>

        <!-- Sonuç Alanı -->
        <div id="result-area" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Sonuçlar</h2>

            <!-- Genişletilmiş Prompt Seçenekleri -->
            <div id="expansions-section" class="mb-4 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-2">Genişletilmiş Prompt Seçenekleri:</h3>
                <div id="expansions-list" class="space-y-2"></div>
                <p class="text-sm text-gray-600 mt-2">Not: Şimdilik, genişletilmiş bir prompt'u kullanmak için kopyalayıp yukarıdaki alana yapıştırın ve tekrar gönderin.</p>
            </div>

            <!-- Sorular Alanı -->
            <div id="questions-section" class="mb-4 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-2">Prompt'u İyileştirmek İçin Sorular:</h3>
                <form id="answers-form" class="space-y-4"></form>
                 <div class="text-center mt-4">
                    <button type="button" id="submit-answers-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-md transition duration-150 ease-in-out inline-flex items-center">
                        Cevapları Gönder
                         <span id="loading-spinner-answers" class="hidden ml-2 w-4 h-4 border-2 border-white border-solid rounded-full"></span>
                    </button>
                </div>
            </div>

            <!-- Final Prompt Alanı -->
            <div id="final-prompt-section" class="hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-2">Oluşturulan Final Prompt:</h3>
                <p id="final-prompt-text" class="text-gray-800 bg-gray-50 p-4 rounded border border-gray-200 whitespace-pre-wrap"></p>
            </div>

             <!-- Hata Alanı -->
            <div id="error-section" class="hidden mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <strong class="font-bold">Hata!</strong>
                <span class="block sm:inline" id="error-message"></span>
            </div>
        </div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
